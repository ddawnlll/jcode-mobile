<svg xmlns="http://www.w3.org/2000/svg" style="background:#1A4F46" class="continuity-flow" viewBox="0 0 610 320" role="img" aria-labelledby="flow-title flow-desc"><style>text{font-family:sans-serif;fill:#FAFCFA}.secondary-label{fill:#DCE8DF}.dim-line{stroke:#DCE8DF;stroke-opacity:.35}.strong-line{stroke:#DCE8DF}.clay-mark{fill:#E87752}</style><title id="flow-title">Execution belongs to the VPS</title><desc id="flow-desc">The phone moves from viewing to closed to reconnected. The VPS turn continues across the phone closure. Reopening restores history and current server state.</desc><text x="0" y="28" font-size="14">Phone</text><text x="0" y="164" font-size="14">VPS</text><path d="M0 48H610M0 184H610" fill="none" class="dim-line"/><text x="0" y="83" font-size="20">Viewing</text><text x="220" y="83" font-size="20">Closed</text><text x="440" y="83" font-size="20">Back again</text><path d="M0 121H133M440 121H610" class="strong-line" fill="none" stroke-width="3"/><path d="M150 121H425" class="dim-line" fill="none" stroke-dasharray="3 6"/><path d="M0 218H610" class="strong-line" fill="none" stroke-width="4"/><circle cx="240" cy="218" r="5" class="clay-mark"/><text x="0" y="254" font-size="16">The same server-owned turn</text><text x="440" y="114" font-size="11" class="secondary-label">Reconcile saved history</text><text x="0" y="307" font-size="12" class="secondary-label">Requires continuation-aware server integration.</text></svg>