<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 0, open: { 4: true }, fade: false }; }
  componentDidMount() { this.iv = setInterval(() => this.tick(), 250); }
  componentWillUnmount() { clearInterval(this.iv); }
  tick() {
    const t = this.state.t + 0.25;
    if (t >= 21) { this.setState({ t: 0, fade: false, open: { 4: true } }); return; }
    this.setState({ t, fade: t >= 20.4 });
  }
  renderVals() {
    const S = this.state, t = S.t;
    const tri = { heron: '010', owl: '100', wren: '110', lynx: '001' };
    const triD = (b) => b.split('').map((x, i) => { const y = 7 + i * 5; return x === '1' ? 'M5 ' + y + ' H19' : 'M5 ' + y + ' H10.4 M13.6 ' + y + ' H19'; }).join(' ');
    const clock = (s) => { s = Math.floor(s); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); };
    // [who, title, touched, detail, start, end]  times in seconds of this loop; start < 0 means already running
    const P = [
      ['owl', 'Card follows its thread id', 'TodoCard.tsx +48 −12', 'The card reads the thread id from the route, so it no longer shows the last thread you opened.', -99, -60],
      ['owl', 'Unpin when the thread is archived', 'pins.ts +9', 'Archiving a thread clears its pin; restoring it brings the pin back.', -60, -30],
      ['wren', 'Store pins per server', 'pins.ts +21 −6', 'Pins are keyed by server and thread, so two servers never share a card.', -30, -8],
      ['wren', 'Migrate old pins', 'migrate.ts +34', 'Moves pins saved by 0.6 into the new keys, once, then forgets the old ones.', -42, 6],
      ['lynx', 'Drag to reorder', 'TodoCard.tsx +27 −4', 'Long-press a todo, then drag. The order is saved with the pin.', -51, 12.5],
      ['heron', 'Card in the thread header', 'ThreadHeader.tsx', 'Waits for the migration, then places the card under the title.', 6.6, 15],
      ['heron', 'Tests', 'pins.test.ts', 'Runs last, after every other step has landed.', 15.6, 99],
    ];
    const toggle = (i) => () => { const o = Object.assign({}, this.state.open); o[i] = !o[i]; this.setState({ open: o }); };
    let doneN = 0, nowN = 0;
    const steps = P.map(([who, title, touched, detail, a, b], i) => {
      const st = t >= b ? 'done' : (t >= a ? 'now' : 'todo');
      if (st === 'done') doneN++; if (st === 'now') nowN++;
      const meta = st === 'done' ? who + ' · ' + touched : (st === 'now' ? who + ' · working · ' + clock(t - a) : who + ' · waits for ' + (i === 5 ? 'the migration' : 'the rest'));
      const open = !!S.open[i + 1];
      return { n: i + 1, who, title, touched, detail, meta, now: st === 'now', d: triD(tri[who]),
        cls: st + (open ? ' open' : ''), ex: open ? 'true' : 'false', toggle: toggle(i + 1),
        status: st === 'done' ? 'done' : (st === 'now' ? clock(t - a) : 'waiting') };
    });
    const segs = steps.map(s => ({ cls: s.cls.split(' ')[0] }));
    const waitN = P.length - doneN - nowN;
    const agents = ['heron', 'owl', 'wren', 'lynx'].map(w => {
      const mine = steps.filter(s => s.who === w);
      const cur = mine.find(s => s.now);
      const next = mine.find(s => s.cls.indexOf('todo') === 0);
      const state = cur ? 'now' : (next ? 'todo' : 'done');
      return { name: w, d: triD(tri[w]), now: state === 'now', done: state === 'done', todo: state === 'todo',
        line: cur ? cur.title : (next ? 'next: ' + next.title.toLowerCase() : 'finished its part') };
    });
    return { steps, segs, agents, fadeCls: S.fade ? 'fadeall' : '',
      sum: doneN + ' of ' + P.length + ' done', sum2: nowN + ' at work · ' + waitN + ' waiting',
      sumLabel: doneN + ' of ' + P.length + ' steps done, ' + nowN + ' at work, ' + waitN + ' waiting' };
  }
}
