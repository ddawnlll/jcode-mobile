<style>
body{margin:0;background:var(--paper,#EEE4CC)}
a{color:inherit;text-decoration:none}
.s button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.s input{font-family:inherit}
.s input::placeholder{color:var(--ink3);font-style:italic}
.s .zh{font-family:'Ma Shan Zheng','STKaiti','KaiTi',serif;font-weight:400}
.s .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.s .clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .seal{background:var(--seal);color:var(--onseal);display:flex;align-items:center;justify-content:center;border-radius:2px;filter:url(#rough);flex:none}
.s .ring{width:13px;height:13px;border:1.6px solid var(--seal);border-radius:50%;display:inline-block;box-sizing:border-box;flex:none}
.s .step{display:grid;grid-template-columns:24px 1fr auto;align-items:baseline;column-gap:6px;font-size:16px;line-height:25px;color:var(--ink2)}
.s .step .no{font-family:'Ma Shan Zheng','KaiTi',serif;font-size:17px;color:var(--ink)}
.s .step .t{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--ink3);margin-right:4px}
.s .spin::after{content:'⠋';font-family:'JetBrains Mono',ui-monospace,monospace;animation:s-braille .9s steps(1) infinite}
@keyframes s-braille{0%{content:'⠋'}10%{content:'⠙'}20%{content:'⠹'}30%{content:'⠸'}40%{content:'⠼'}50%{content:'⠴'}60%{content:'⠦'}70%{content:'⠧'}80%{content:'⠇'}90%{content:'⠏'}}
@keyframes s-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes s-wet{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s-wake{0%{transform:scaleX(.6);opacity:.5}100%{transform:scaleX(1.5);opacity:0}}
@keyframes s-drift{0%{transform:translateX(-26px)}100%{transform:translateX(26px)}}
@keyframes s-sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
@keyframes s-turn{to{transform:rotate(360deg)}}
@keyframes s-shimmer{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes s-fly{0%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(30px,2px)}75%{transform:translate(12px,10px)}100%{transform:translate(0,0)}}
@keyframes s-flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes s-stamp{0%{transform:scale(1.7) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes s-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s-ink{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@keyframes s-bleed{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.s .bob{animation:s-bob 4.5s ease-in-out infinite}
.s .wet{animation:s-wet 2.6s ease-in-out infinite}
.s .wake{animation:s-wake 3.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
.s .drift{animation:s-drift 16s ease-in-out infinite alternate}
.s .sway{animation:s-sway 6s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}
.s .sway2{animation:s-sway 7.5s ease-in-out -2s infinite;transform-origin:bottom center;transform-box:fill-box}
.s .turn{animation:s-turn 60s linear infinite;transform-origin:center;transform-box:fill-box}
.s .shimmer{animation:s-shimmer 3.4s ease-in-out infinite}
.s .fly{animation:s-fly 9s ease-in-out infinite}
.s .flap{animation:s-flap .5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.s .stamp{animation:s-stamp .7s cubic-bezier(.2,.8,.2,1) .5s both}
.s .rise{animation:s-rise .7s ease-out both}

@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.1) translate(-12px,-6px)}}
.s .kb{animation:kb 34s ease-in-out infinite alternate;transform-origin:60% 40%}
.s .screen{position:absolute;inset:0;background:var(--paper);overflow:hidden}
@keyframes t-drop{from{clip-path:circle(0px at var(--ox,50%) var(--oy,50%));filter:blur(2px)}to{clip-path:circle(160% at var(--ox,50%) var(--oy,50%));filter:blur(0)}}
@keyframes t-dim{from{opacity:1;transform:scale(1)}to{opacity:.35;transform:scale(.985)}}
@keyframes t-mist-out{from{opacity:1;filter:blur(0);transform:translateY(0)}to{opacity:0;filter:blur(10px);transform:translateY(-14px)}}
@keyframes t-mist-in{from{opacity:.3;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes t-unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes t-roll{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
@keyframes t-fade{from{opacity:1}to{opacity:.5}}
@keyframes t-edge{from{top:0}to{top:100%}}
@keyframes t-ring{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
.s .enter-drop{z-index:2;animation:t-drop .85s cubic-bezier(.4,0,.2,1) both}
.s .leave-drop{z-index:1;animation:t-dim .85s ease both}
.s .enter-mist{z-index:1;animation:t-mist-in .8s ease both}
.s .leave-mist{z-index:2;animation:t-mist-out .8s ease both;pointer-events:none}
.s .enter-unroll{z-index:2;animation:t-unroll .75s cubic-bezier(.3,0,.2,1) both}
.s .leave-unroll{z-index:1;animation:t-fade .75s ease both}
.s .leave-roll{z-index:2;animation:t-roll .7s cubic-bezier(.5,0,.6,1) both;pointer-events:none}
.s .enter-roll{z-index:1;animation:t-mist-in .7s ease both}
.s .rod{position:absolute;left:-6px;right:-6px;height:6px;border-radius:3px;background:var(--ink);opacity:.75;animation:t-edge .75s cubic-bezier(.3,0,.2,1) both;z-index:3}
.s .ringdraw circle{stroke-dasharray:44;animation:t-ring .9s ease-out both}
.s .press:active{transform:scale(.92) rotate(-3deg)}
@media (prefers-reduced-motion:reduce){.s .screen{animation-duration:.01ms!important}}

/* ---- smoothness pass: only opacity and transform animate; one easing ---- */
.s{--ease:cubic-bezier(.22,1,.36,1)}
.s .grain{position:absolute;inset:0;pointer-events:none;background-size:256px 256px;z-index:5}
.s .grain-day{background-image:url(../assets/grain-day.png)}
.s .grain-night{background-image:url(../assets/grain-night.png)}
@keyframes s-rise{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes s-bleed{from{opacity:0}to{opacity:1}}
@keyframes t-drop{from{clip-path:circle(0px at var(--ox,50%) var(--oy,50%))}to{clip-path:circle(160% at var(--ox,50%) var(--oy,50%))}}
@keyframes t-mist-out{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,-10px,0) scale(1.01)}}
.s .rise{animation:s-rise .9s var(--ease) both}
.s .bleedin{animation:s-bleed 1.2s var(--ease) both}
.s .kb{will-change:transform;animation-timing-function:ease-in-out}
.s .drift{will-change:transform}
.s .screen{will-change:transform,opacity,clip-path;backface-visibility:hidden}
.s .enter-drop{animation:t-drop .9s var(--ease) both}
.s .leave-drop{animation:t-dim .9s var(--ease) both}
.s .enter-mist{animation:t-mist-in .9s var(--ease) both}
.s .leave-mist{animation:t-mist-out .7s var(--ease) both}
.s .enter-unroll{animation:t-unroll .8s var(--ease) both}
.s .rod{animation:t-edge .8s var(--ease) both}
.s button,.s a{transition:transform .18s var(--ease),opacity .18s var(--ease);-webkit-tap-highlight-color:transparent}
.s button:active,.s a:active{transform:scale(.97);opacity:.85}
.s .seal:active{transform:scale(.9) rotate(-3deg)}

@keyframes l-word{from{opacity:0;transform:translate3d(0,3px,0)}to{opacity:1;transform:none}}
@keyframes l-in{from{opacity:0;transform:translate3d(-6px,0,0)}to{opacity:1;transform:none}}
@keyframes l-drop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes l-flow{from{transform:translate3d(-60%,0,0)}to{transform:translate3d(160%,0,0)}}
@keyframes l-grind{to{transform:rotate(360deg)}}

.s .w{display:inline-block;white-space:pre;animation:l-word .5s var(--ease) both}
.s .slidein{animation:l-in .6s var(--ease) both}
.s .inkdot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:l-drop .55s var(--ease) both}
.s .flow{position:relative;height:1.5px;margin:0 0 2px 26px;overflow:hidden}
.s .flow::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:l-flow 1.6s ease-in-out infinite;will-change:transform}
.s .grind{animation:l-grind 2.4s linear infinite;transform-origin:center;transform-box:fill-box}
.s .stack{display:grid}.s .stack>*{grid-area:1/1}
.s .trow .done-only,.s .think .done-only{opacity:0;transition:opacity .5s var(--ease)}

.s .trow.done .run-only,.s .think.done .run-only{opacity:0}
.s .ring2 circle{stroke-dasharray:37;stroke-dashoffset:37;transition:stroke-dashoffset .9s var(--ease) .1s}

.s .think .bar{position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--ink3);opacity:.5;transform-origin:top;animation:l-grow 3.4s var(--ease) both}
.s .live-main{transition:opacity .8s var(--ease)}

.s .nav{position:absolute;left:0;right:0;bottom:0;height:70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);background:var(--paper);z-index:6}
.s .nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:16px;font-style:italic;color:var(--ink3)}

.s .sorts{display:flex;gap:4px;align-items:center}

.s .sorts button.on::after{transform:scaleX(1)}
.s .trow2{display:grid;grid-template-columns:28px minmax(0,1fr) 22px;align-items:center;column-gap:12px;min-height:58px;width:100%;text-align:left;animation:m-in .45s var(--ease) both}

.s .seg2{display:flex;padding:2px;border-radius:9px;background:var(--paper2);gap:2px}

.s .seg2 button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.s .srow2{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:17px;color:var(--ink)}
.s .srow2 .v{margin-left:auto;font-size:15px;font-style:italic;color:var(--ink3);display:flex;align-items:center;gap:6px}

.s .tog::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink3);transition:transform .45s var(--ease),background .35s var(--ease)}
.s .tog.on{border-color:var(--seal);background:var(--seal)}

@keyframes m-in{from{opacity:0;transform:translate3d(0,4px,0)}to{opacity:1;transform:none}}

@keyframes m-fade{from{opacity:0}to{opacity:1}}
.s .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:9;padding:10px 22px 30px;animation:m-sheet .42s var(--ease) both}
.s .scrim2{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:8;animation:m-fade .3s var(--ease) both}
.s .opt{display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center;gap:10px;min-height:64px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.s .scroll{overflow:auto;scrollbar-width:none}

</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '', sort: 'provider', model: 'gpt-5.6-luna', ink: 3, scope: 'thread' }; }
  renderVals() {
    const S = this.state;
    const R = [
      ['gpt-5.6-luna', 'openai', 'responses', true, 'your ChatGPT subscription'],
      ['gpt-5.6-luna-mini', 'openai', 'responses', true, 'quicker, lighter'],
      ['gpt-5.2', 'openai', 'responses', false, 'not in your plan'],
      ['claude-opus-5-5', 'anthropic', 'messages', true, 'your Claude subscription'],
      ['claude-sonnet-5-5', 'anthropic', 'messages', true, 'your Claude subscription'],
      ['claude-haiku-5-5', 'anthropic', 'messages', true, 'quick and light'],
      ['deepseek-v4-flash', 'command-code', 'chat', true, 'quick and light'],
      ['deepseek-v4', 'command-code', 'chat', false, 'key missing on the server'],
    ];
    const q = S.q.trim().toLowerCase();
    let list = R.filter(r => !q || (r[0] + ' ' + r[1] + ' ' + r[4]).toLowerCase().indexOf(q) >= 0);
    const cmp = { provider: (a, b) => a[1].localeCompare(b[1]) || a[0].localeCompare(b[0]), name: (a, b) => a[0].localeCompare(b[0]),
                  available: (a, b) => (b[3] - a[3]) || a[1].localeCompare(b[1]) || a[0].localeCompare(b[0]) };
    list = list.slice().sort(cmp[S.sort]);
    let last = null;
    const rows = list.map((r, i) => {
      const head = S.sort === 'provider' && r[1] !== last; last = r[1];
      return { name: r[0], provider: r[1], api: r[2], off: !r[3], note: r[4], head, on: r[0] === S.model,
        sub: S.sort === 'provider' ? r[4] : r[1] + ' · ' + r[4], delay: (i * 0.03).toFixed(2),
        pick: () => { if (r[3]) this.setState({ model: r[0] }); } };
    });
    const cur = R.find(r => r[0] === S.model);
    const en = ['minimal', 'low', 'medium', 'high', 'xhigh', 'max'];
    const inks = en.map((e, i) => ({ en: e, ink: (0.12 + i * 0.17).toFixed(2), on: i === S.ink, ring: i === S.ink ? 'var(--seal)' : 'transparent', lab: i === S.ink ? 'var(--ink)' : 'var(--ink3)', pick: () => this.setState({ ink: i }) }));
    const sorts = ['provider', 'name', 'available'].map(k => ({ label: k, cls: S.sort === k ? 'on' : '', pressed: S.sort === k ? 'true' : 'false', pick: () => this.setState({ sort: k }) }));
    const scopes = [['thread', 'this thread'], ['new', 'new threads']].map(([k, l]) => ({ label: l, cls: S.scope === k ? 'on' : '', pressed: S.scope === k ? 'true' : 'false', pick: () => this.setState({ scope: k }) }));
    return { rows, inks, sorts, scopes, q: S.q, onQ: (e) => this.setState({ q: e.target.value }), empty: rows.length === 0,
      model: S.model, route: cur[1] + ' · ' + cur[2] + ' · ' + cur[4], effort: en[S.ink],
      when: S.scope === 'thread' ? 'fox uses it from its next turn' : 'every new thread starts with it' };
  }
}
