@keyframes s-rise{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}

rows}}" as="r" hint-placeholder-count="6"><div style="opacity:{{r.op}}"><a href="Main-Night.dc.html" class="trow2" style="animation-delay:{{r.delay}}s"><span class="seal" aria-hidden="true" style="width:28px;height:28px;flex:none"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="{{r.d}}" fill="none" style="stroke:var(--onseal)" stroke-width="2.6" stroke-linecap="round"></path></svg></span><span style="min-width:0"><span class="tt clip">{{r.title}}</span><span class="tn clip">{{r.note}}</span></span><sc-if value="{{r.live}}" hint-placeholder-val="{{false}}"><span class="mono spin" role="img" aria-label="Working" style="font-size:14px;color:var(--blue)"></span></sc-if><sc-if value="{{r.done}}" hint-placeholder-val="{{false}}"><span class="ring" role="img" aria-label="Finished" style="width:13px;height:13px"></span></sc-if><sc-if value="{{r.ask}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Waiting for you" style="width:10px;height:10px;border-radius:50%;background:var(--seal)"></span></sc-if><sc-if value="{{r.rest}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Resting" style="width:6px;height:6px;border-radius:50%;background:var(--ink3);opacity:.6"></span></sc-if></a><sc-if value="{{r.has}}" hint-placeholder-val="{{false}}"><button type="button" aria-expanded="{{r.ex}}" onClick="{{r.fold}}" class="mono" style="height:30px;padding-left:40px;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px"><span style="display:inline-block;transition:transform .4s var(--ease);transform:rotate({{r.rot}}deg)">›</span>{{r.subN}}</button><sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><div><sc-for list="{{r.subs}}" as="s" hint-placeholder-count="3"><a href="Main-Night.dc.html" class="trow2 sub"><span class="seal" aria-hidden="true" style="width:20px;height:20px;flex:none"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="{{s.d}}" fill="none" style="stroke:var(--onseal)" stroke-width="2.6" stroke-linecap="round"></path></svg></span><span style="min-width:0"><span class="tt clip">{{s.title}}</span><span class="tn clip"><span class="tag">sub-agent</span>{{s.note}}</span></span><sc-if value="{{s.live}}" hint-placeholder-val="{{false}}"><span class="mono spin" role="img" aria-label="Working" style="font-size:14px;color:var(--blue)"></span></sc-if><sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><span class="ring" role="img" aria-label="Finished" style="width:13px;height:13px"></span></sc-if><sc-if value="{{s.ask}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Waiting for you" style="width:10px;height:10px;border-radius:50%;background:var(--seal)"></span></sc-if><sc-if value="{{s.rest}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Resting" style="width:6px;height:6px;border-radius:50%;background:var(--ink3);opacity:.6"></span></sc-if></a></sc-for></div></sc-if></sc-if></div></sc-for><sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin:24px 0;font-size:16px;font-style:italic;color:var(--ink3)">Nothing by that name.</p></sc-if></div><a href="Main-Night.dc.html" class="seal" aria-label="New thread" style="position:absolute;right:20px;bottom:88px;width:52px;height:52px;z-index:7"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" style="stroke:var(--onseal)" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5 V18.5 M5.5 12 H18.5"></path></svg></a><nav class="nav" aria-label="Sections"><a href="Home-Night.dc.html" class=""><span>home</span><span class="nd" aria-hidden="true"></span></a><a href="Sessions-Night.dc.html" class="on" aria-current="page"><span>threads</span><span class="nd" aria-hidden="true"></span></a><a href="Settings-Night.dc.html" class=""><span>settings</span><span class="nd" aria-hidden="true"></span></a></nav>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '', sort: 'recent', open: { heron: true } }; }
  renderVals() {
    const S = this.state;
    const triD = (b) => b.split('').map((x, i) => { const y = 7 + i * 5; return x === '1' ? 'M5 ' + y + ' H19' : 'M5 ' + y + ' H10.4 M13.6 ' + y + ' H19'; }).join(' ');
    const T = [
      { id: 'fox', title: 'Adapter v4 timeline', note: 'working · step 4 of 4', st: 'live', rank: 1, age: 1, subs: [] },
      { id: 'crane', title: 'Clean the build cache', note: 'waiting for you', st: 'ask', rank: 0, age: 2, subs: [] },
      { id: 'heron', title: 'Pinned todo card', note: 'coordinating · plan 4 of 7', st: 'live', rank: 1, age: 3, subs: [
        { id: 'owl', title: 'Unpin when archived', note: 'finished its part', st: 'done' },
        { id: 'wren', title: 'Migrate old pins', note: 'working', st: 'live' },
        { id: 'lynx', title: 'Drag to reorder', note: 'working', st: 'live' } ] },
      { id: 'owl', title: 'Socket timeout', note: 'finished fourteen minutes ago', st: 'done', rank: 2, age: 4, subs: [] },
      { id: 'moth', title: 'Android back stack', note: 'resting since Saturday', st: 'rest', rank: 3, age: 9, subs: [] },
      { id: 'crane', title: 'Release notes for 0.6', note: 'finished last week', st: 'done', rank: 2, age: 12, subs: [], key: 'crane2' },
    ];
    const tri = { crane: '111', fox: '101', heron: '010', owl: '100', moth: '011', wren: '110', lynx: '001' };
    const q = S.q.trim().toLowerCase();
    const hit = (x) => !q || (x.title + ' ' + x.note + ' ' + x.id).toLowerCase().indexOf(q) >= 0;
    let list = T.filter(x => hit(x) || x.subs.some(hit));
    const by = { recent: (a, b) => a.age - b.age, name: (a, b) => a.title.localeCompare(b.title), status: (a, b) => a.rank - b.rank || a.age - b.age };
    list = list.slice().sort(by[S.sort]);
    const mk = (st) => ({ live: st === 'live', done: st === 'done', ask: st === 'ask', rest: st === 'rest' });
    const rows = list.map((x, i) => {
      const k = x.key || x.id, open = !!S.open[k] || (q && x.subs.some(hit));
      return Object.assign({}, mk(x.st), { d: triD(tri[x.id]), title: x.title, note: x.note, has: x.subs.length > 0, subN: x.subs.length + ' sub-agents',
        open, ex: open ? 'true' : 'false', rot: open ? 90 : 0, op: x.st === 'rest' ? 0.62 : 1, delay: (i * 0.04).toFixed(2),
        fold: () => { const o = Object.assign({}, this.state.open); o[k] = !open; this.setState({ open: o }); },
        subs: x.subs.map(s => Object.assign({}, mk(s.st), { d: triD(tri[s.id]), title: s.title, note: s.id + ' · ' + s.note })) });
    });
    const sorts = ['recent', 'name', 'status'].map(k => ({ label: k, cls: S.sort === k ? 'on' : '', pressed: S.sort === k ? 'true' : 'false', pick: () => this.setState({ sort: k }) }));
    return { rows, sorts, q: S.q, onQ: (e) => this.setState({ q: e.target.value }), empty: rows.length === 0, count: rows.length + (rows.length === 1 ? ' thread' : ' threads') };
  }
}

</script>
