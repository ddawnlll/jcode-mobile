name: android-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without v)
        required: true
        default: 0.2.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bunx --bun expo prebuild --platform android --no-install
      - name: Assert generated Gradle uses Bun
        run: |
          grep -q 'nodeExecutableAndArgs.set(\["bun", "--bun"\])' android/app/build.gradle
          ! grep -q '\["node",' android/app/build.gradle
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Package release artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$APK" "dist/jcode-mobile-$VERSION-android-release.apk"
          (
            cd dist
            sha256sum "jcode-mobile-$VERSION-android-release.apk" > "jcode-mobile-$VERSION-android-release.apk.sha256"
          )
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: jcode-mobile-${{ inputs.version }}-android-release
          path: dist/*
          if-no-files-found: error
