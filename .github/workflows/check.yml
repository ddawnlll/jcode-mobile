name: check

# The JavaScript job covers the repository and the retained Expo client. The
# Rust job builds and tests Adapter v3. The Stillness Android job builds the
# current Tauri 2 application that actually ships. The manual Android jobs at
# the end build the legacy Expo client only.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build the legacy Expo 0.2.2 APK (not the 0.3.1 Stillness APK)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - name: Install Stillness dependencies
        run: cd apps/stillness && bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Build Stillness web bundle
        run: cd apps/stillness && bun run build
      - name: Adapter contract tests
        run: bun run adapter:test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  stillness-android:
    # Builds the real 0.4.0 Tauri Stillness APK. This is the release gate; the
    # legacy Expo jobs below are retained for the 0.2.x client only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/stillness/src-tauri
      - name: Install Stillness dependencies
        run: cd apps/stillness && bun install --frozen-lockfile
      - name: Build signed Stillness APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash scripts/build-stillness-android.sh
      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK="$(ls -1 artifacts/jcode-mobile-*-android-release.apk | head -n 1)"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 4
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: stillness-android-release
          path: |
            artifacts/jcode-mobile-*-android-release.apk
            artifacts/jcode-mobile-*-android-release.apk.sha256
          if-no-files-found: error

  android-build:
    # Manual legacy Expo debug build; skipped for the legacy release APK.
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bunx --bun expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleDebug --no-daemon

  android-release:
    # Manual legacy Expo release APK with embedded JS. Debug-signed; this is
    # not the current Stillness 12 APK.
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bunx --bun expo prebuild --platform android --no-install
      - name: Assert generated Gradle uses Bun
        run: |
          grep -Fq 'nodeExecutableAndArgs.set(["bun", "--bun"])' android/app/build.gradle
          ! grep -Fq '["node",' android/app/build.gradle
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Package release artifact
        env:
          VERSION: 0.2.2
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$APK" "dist/jcode-mobile-$VERSION-android-release.apk"
          (
            cd dist
            sha256sum "jcode-mobile-$VERSION-android-release.apk" > "jcode-mobile-$VERSION-android-release.apk.sha256"
          )
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-expo-0.2.2-android-release
          path: dist/*
          if-no-files-found: error
