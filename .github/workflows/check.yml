name: check

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build the release APK
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Adapter contract tests
        run: bun run adapter:test

  android-build:
    # Manual debug build; skipped when the dispatch asks for a release APK.
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bunx --bun expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleDebug --no-daemon

  android-release:
    # Manual release APK with embedded JS. Debug-signed for sideloading.
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bunx --bun expo prebuild --platform android --no-install
      - name: Assert generated Gradle uses Bun
        run: |
          grep -Fq 'nodeExecutableAndArgs.set(["bun", "--bun"])' android/app/build.gradle
          ! grep -Fq '["node",' android/app/build.gradle
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Package release artifact
        env:
          VERSION: 0.2.0
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$APK" "dist/jcode-mobile-$VERSION-android-release.apk"
          (
            cd dist
            sha256sum "jcode-mobile-$VERSION-android-release.apk" > "jcode-mobile-$VERSION-android-release.apk.sha256"
          )
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: jcode-mobile-0.2.0-android-release
          path: dist/*
          if-no-files-found: error
