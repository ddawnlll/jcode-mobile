[workspace]
resolver = "2"
members = [
  "crates/adapter-protocol",
  "crates/adapter-core",
  "crates/adapter-server",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
authors = ["JCode Mobile contributors"]
repository = "https://github.com/ddawnlll/jcode-mobile"

[workspace.dependencies]
adapter-core = { path = "crates/adapter-core" }
adapter-protocol = { path = "crates/adapter-protocol" }
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
futures-util = "0.3"
http = "1"
jcode-sdk = { git = "https://github.com/ddawnlll/jcode", rev = "0abff12c7f2b55ec03b38a42dedbcd5f4eff13f8" }
rand = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
