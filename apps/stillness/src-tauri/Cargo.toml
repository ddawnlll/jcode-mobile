[workspace]

[package]
name = "stillness"
version = "0.3.0"
description = "Stillness 12 desktop shell for JCode Mobile"
authors = ["JCode Mobile"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "stillness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
